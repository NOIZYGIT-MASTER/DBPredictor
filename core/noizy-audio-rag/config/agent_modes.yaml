runtime:
  control_plane: DesktopCommander
  governance: MC96
  receipt_engine: Papyrus
  default_mode: recommend
  mode_transition_requires_receipt: true

artist_sovereignty:
  prime_directive: "Every artist is a unique individual. Their voice, brand, catalog, and future belong to them alone."
  pillars:
    - CONTROL: artist holds final authority on every creative and commercial decision
    - CREDIBILITY: brand voice and creative DNA are per-artist, never blended or templated
    - BRAND_CURATION: catalog, persona, and market position researched individually per artist
    - MONETIZATION: revenue paths built from the artist's catalog — no lock-in, transparent
    - CATALOG_SOVEREIGNTY: raw assets local, SHA-256 receipts on every asset, lineage immutable
  hard_limits:
    - never_share_voice_dna_across_artists: true
    - never_publish_without_artist_approval_receipt: true
    - never_overwrite_master_files: true
    - never_use_artist_data_for_training_without_consent: true
    - never_generate_generic_output: true  # every output calibrated to the specific artist
  per_artist_expansion_loop:
    steps:
      - DISCOVER: scan catalog for untapped assets
      - CONTEXTUALIZE: identify market moment fit
      - PROPOSE: specific opportunity (sync/release/collab/licensing)
      - GATE: hold for artist approval before any action
      - EXECUTE: only on explicit approval with receipt
      - LEARN: update artist profile with outcome

modes:
  observe:
    description: Read-only telemetry and discovery.
    allows:
      - search
      - scan
      - metadata_lookup
      - receipt_verify
      - artist_catalog_research
      - brand_opportunity_discovery
    denies:
      - writes
      - deploy
      - sync_mutation
  recommend:
    description: Build plans and proposals without storage mutation.
    allows:
      - observe
      - plan_generation
      - risk_assessment
      - migration_preview
      - monetization_opportunity_report
      - brand_development_proposal
    denies:
      - writes
      - delete
  execute:
    description: Mutating mode for approved actions.
    requires:
      - approval_token
      - signed_request
      - rate_limit_budget
      - artist_identity_confirmed
    allows:
      - ingest
      - embeddings
      - faiss_build
      - firestore_mirror_metadata
      - receipt_emit
      - catalog_update
    denies:
      - raw_audio_remote_upload
      - destructive_sync
      - delete
      - cross_artist_data_share
  continuous:
    description: Scheduled/event-driven execution loop using n8n.
    requires:
      - execute_mode_requirements
      - schedule_policy
      - failure_stop_policy
    allows:
      - scheduled_scan
      - webhook_sync
      - pipeline_retries_non_destructive
      - nightly_brand_opportunity_scan

approval:
  gatekeeper: MC96
  policy:
    can_recommend: true
    cannot_mutate_without_approval: true
    no_overwrite_without_approval: true
    artist_approval_required_for_creative_output: true
    monetization_requires_artist_confirmation: true

failure_policy:
  fail_fast: true
  stage_stop_on_error: true
  emit_failure_receipt: true
  notify_channels:
    - MCP.Discord
    - MCP.Matrix

doctrine:
  - one_command_one_action_one_receipt
  - raw_assets_stay_local
  - metadata_syncs
  - vectors_mirror
  - receipts_rule
  - mc96_governs
  - artists_are_not_products
  - voice_dna_is_sovereign
  - catalog_is_the_greatest_asset
  - control_credibility_brand_monetization_sovereignty
